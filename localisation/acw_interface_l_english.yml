 acw_arma_kumana:0"Kumana"
 acw_arma_kumana_desc:0"A classic hunting weapon from the jungle regions of Antisuyu, it was never used as a military weapon until the retreat of Manco Inca Yupanqui to Vilcabamba when it was integrated into the Guerrilla warfare against the Peruvian cavalry."
 acw_arma_tomahawk:0"Pipe Tomahawk"
 acw_arma_tomahawk_desc:0"Tomahawks were general-purpose tools used by Native Americans and later the European colonials with whom they traded, and often employed as a hand-to-hand weapon. The metal tomahawk heads were originally based on a Royal Navy boarding axe (a lightweight hand axe designed to cut through boarding nets when boarding hostile ships) and used as a trade-item with Native Americans for food and other provisions."
 acw_arma_boomerang:0"Returning Boomerang"
 acw_arma_boomerang_desc:0"The boomerang is recognised by many as a significant cultural symbol of Australia. The term 'returning boomerang' is used to distinguish between ordinary boomerangs and the small percentage which, when thrown, will return to its thrower. The oldest wooden boomerang artefact known in Australia, excavated from the Wyrie Swamp, South Australia in 1973, is estimated to be 9,500 years old."
 acw_arma_kumana_modifier:0"Fire Damage: §G+10%§!"
 acw_arma_tomahawk_modifier:0"Morale: §G+5%§!"
 acw_arma_boomerang_modifier:0"Land Attrition: §G-10%§!"
 acw_hd_38.t:0"Night Attack of The Sanjo Palace"
 acw_hd_38.d:0"Unfurled this work stands apart. Its now-forgotten artist used the expressive potential of the long, narrow emaki format with such interpretive brilliance that he perhaps considered that on occasion it might be fully open. He organized a jumble of minutiae into a cohesive narrative arc.\n Dr. Hannah Sigur \n\n'Night Attack on the Sanjo Palace' is an thirtenth century handscroll by an unknown @JAPJapanese author, created in the Kamakura period.  "
 acw_hd_38.a:0"Comission a masterwork!"
 acw_hd_38.b:0"Marvelous!"
 
