 #update 1.02 - The Fourth Company and the Puck Gun
 acw_hd_36.t:0"A man comes forth" 
 acw_hd_36.d:0"Today, one of our generals with a strange, well dressed lady in tow have demanded audience with [Root.Monarch.GetHerHisCap] Majesty, §G[Root.Monarch.GetName]§! of the House $DYNASTY$. His insolence should land him in prison rotting, however he is one of our most accomplished heroes, earning us victory after victory on the field of battle. His military prowress is undeniable, but the demands of 'expanding our military with modernised auxila' is a major headache.\n\nShall we support this venture? We may not have an opportunity like this again."
 acw_hd_36.a:0"Yes, yes. He clearly knows his stuff."
 acw_hd_36.b:0"How dares he!"
 acw_hd_36.tt:0"Unlock the §Yfourth§! Chevauchee slot, and gain free company. If you have the gained company already unlocked, gain an §YUpgrade point§!."
 acw_arma_puck_gun_desc:0"The Puckle gun, invented by James Puckle in 1718, is an early form of a rapid-fire weapon. It is a tripod-mounted, manually operated flintlock gun that features a revolving cylinder, allowing it to fire multiple shots in quick succession. The Puckle gun is often considered a precursor to modern machine guns and was designed primarily for naval use to defend ships from boarding parties."
 acw_arma_puck_gun:0"Puckle Gun"
 acw_arma_puck_gun_modifier:0"Privateer Efficiency: §G+20%§!"
 
